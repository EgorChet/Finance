<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#0a0a0d" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finance" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Finance Analyzer</title>
    <style>
      /* Launch screen: shown until the app mounts and replaces #app's content. */
      html, body { margin: 0; background: #0a0a0d; }
      .boot {
        position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden;
        background:
          radial-gradient(60rem 28rem at 15% -8%, rgba(123, 108, 255, 0.28), transparent 60%),
          radial-gradient(40rem 22rem at 100% 0%, rgba(79, 195, 255, 0.16), transparent 60%),
          radial-gradient(36rem 26rem at 50% 105%, rgba(226, 85, 200, 0.14), transparent 65%),
          #0a0a0d;
        color: #f4f4f6;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
      }
      .boot-inner { display: grid; justify-items: center; gap: 18px; animation: boot-in 0.5s ease-out both; }
      .boot-logo {
        width: 72px; height: 72px; border-radius: 22px; display: grid; place-items: center;
        font-size: 34px; font-weight: 700; color: #fff;
        background: linear-gradient(135deg, #7b6cff 0%, #a35cff 55%, #e255c8 100%);
        box-shadow: 0 16px 40px -12px rgba(123, 108, 255, 0.6);
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      .boot-name { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; color: #9a9aa6; }
      .boot-bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
      .boot-bar::after {
        content: ""; display: block; width: 40%; height: 100%; border-radius: inherit;
        background: linear-gradient(90deg, #7b6cff, #e255c8);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
      @keyframes boot-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot-inner, .boot-logo, .boot-bar::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status" aria-label="Loading Finance">
        <div class="boot-inner">
          <div class="boot-logo" aria-hidden="true">₪</div>
          <div class="boot-name">Finance</div>
          <div class="boot-bar" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
