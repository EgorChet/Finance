<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ч-Банк" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Ч-Банк</title>
    <script>
      (function () {
        try {
          var d = document.documentElement, t = localStorage.getItem("finance_theme"), p = localStorage.getItem("finance_palette");
          if (t === "light" || t === "dark") d.dataset.theme = t;
          if (p && /^(gold|emerald|cobalt|carmine|tiffany|powder|peach)$/.test(p)) d.dataset.palette = p;
        } catch (e) {}
      })();
    </script>
    <style>
      /* Launch screen colours follow the chosen palette and theme (set by the script below). */
      :root { --b-bg: #0b0b0c; --b-text: #f5f3ee; --b-fill: #ffcf3f; --b-on: #111111; --b-end: #ffb300; --b-g1: rgba(255,207,63, 0.22); --b-g2: rgba(255,179,0, 0.12); --b-g3: rgba(255,140,0, 0.1); }
      [data-palette="emerald"] { --b-bg: #08100d; --b-text: #eef6f2; --b-fill: #2bd48a; --b-on: #04140d; --b-end: #12a66a; --b-g1: rgba(43,212,138, 0.22); --b-g2: rgba(18,166,106, 0.12); --b-g3: rgba(61,220,151, 0.1); }
      [data-palette="cobalt"] { --b-bg: #090b11; --b-text: #f0f3fa; --b-fill: #3d6bff; --b-on: #ffffff; --b-end: #2f58e6; --b-g1: rgba(61,107,255, 0.22); --b-g2: rgba(91,133,255, 0.12); --b-g3: rgba(47,88,230, 0.1); }
      [data-palette="carmine"] { --b-bg: #0c0b0b; --b-text: #f6f2f1; --b-fill: #e5392e; --b-on: #ffffff; --b-end: #c92b21; --b-g1: rgba(229,57,46, 0.22); --b-g2: rgba(255,90,74, 0.12); --b-g3: rgba(201,43,33, 0.1); }
      [data-theme="light"] { --b-bg: #f6f3ea; --b-text: #15130e; --b-fill: #ffcf3f; --b-on: #111111; --b-end: #ffb300; --b-g1: rgba(255,207,63, 0.22); --b-g2: rgba(255,179,0, 0.12); --b-g3: rgba(255,140,0, 0.1); }
      [data-palette="emerald"][data-theme="light"] { --b-bg: #eef5f1; --b-text: #0e1a14; --b-fill: #2bd48a; --b-on: #04140d; --b-end: #12a66a; --b-g1: rgba(43,212,138, 0.22); --b-g2: rgba(18,166,106, 0.12); --b-g3: rgba(61,220,151, 0.1); }
      [data-palette="cobalt"][data-theme="light"] { --b-bg: #eff2f9; --b-text: #0f1424; --b-fill: #3d6bff; --b-on: #ffffff; --b-end: #2f58e6; --b-g1: rgba(61,107,255, 0.22); --b-g2: rgba(91,133,255, 0.12); --b-g3: rgba(47,88,230, 0.1); }
      [data-palette="carmine"][data-theme="light"] { --b-bg: #f7f2f0; --b-text: #1a1211; --b-fill: #e5392e; --b-on: #ffffff; --b-end: #c92b21; --b-g1: rgba(229,57,46, 0.22); --b-g2: rgba(255,90,74, 0.12); --b-g3: rgba(201,43,33, 0.1); }
      [data-palette="tiffany"] { --b-bg: #0b1112; --b-text: #eef8f7; --b-fill: #81d8d0; --b-on: #0b2b2a; --b-end: #5cc6bd; --b-g1: rgba(129,216,208, 0.22); --b-g2: rgba(249,182,207, 0.12); --b-g3: rgba(92,198,189, 0.1); }
      [data-palette="powder"] { --b-bg: #120c0f; --b-text: #fbf0f4; --b-fill: #f6a9c4; --b-on: #3b1226; --b-end: #f18fb0; --b-g1: rgba(246,169,196, 0.22); --b-g2: rgba(214,184,255, 0.12); --b-g3: rgba(241,143,176, 0.1); }
      [data-palette="peach"] { --b-bg: #130e0c; --b-text: #fdf3ee; --b-fill: #ffb8a0; --b-on: #3a1a10; --b-end: #f79a7e; --b-g1: rgba(255,184,160, 0.22); --b-g2: rgba(249,182,207, 0.12); --b-g3: rgba(247,154,126, 0.1); }
      [data-palette="tiffany"][data-theme="light"] { --b-bg: #eaf7f6; --b-text: #0f2322; --b-fill: #81d8d0; --b-on: #0b2b2a; --b-end: #5cc6bd; --b-g1: rgba(129,216,208, 0.22); --b-g2: rgba(249,182,207, 0.12); --b-g3: rgba(92,198,189, 0.1); }
      [data-palette="powder"][data-theme="light"] { --b-bg: #fdf1f5; --b-text: #2a1019; --b-fill: #f6a9c4; --b-on: #3b1226; --b-end: #f18fb0; --b-g1: rgba(246,169,196, 0.22); --b-g2: rgba(214,184,255, 0.12); --b-g3: rgba(241,143,176, 0.1); }
      [data-palette="peach"][data-theme="light"] { --b-bg: #fff3ee; --b-text: #2b1610; --b-fill: #ffb8a0; --b-on: #3a1a10; --b-end: #f79a7e; --b-g1: rgba(255,184,160, 0.22); --b-g2: rgba(249,182,207, 0.12); --b-g3: rgba(247,154,126, 0.1); }
      /* Launch screen: shown until the app mounts and replaces #app's content. */
      html, body { margin: 0; background: var(--b-bg); }
      .boot {
        position: fixed; inset: 0; z-index: 2147483000; transition: opacity 0.45s ease, visibility 0.45s; display: grid; place-items: center; overflow: hidden;
        background:
          radial-gradient(60rem 28rem at 15% -8%, var(--b-g1), transparent 60%),
          radial-gradient(40rem 22rem at 100% 0%, var(--b-g2), transparent 60%),
          radial-gradient(36rem 26rem at 50% 105%, var(--b-g3), transparent 65%),
          var(--b-bg);
        color: var(--b-text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
      }
      .boot--out { opacity: 0; visibility: hidden; }
      .boot-inner { display: grid; justify-items: center; gap: 18px; animation: boot-in 0.5s ease-out both; }
      /* The same mark and drawn word as AppLogo.vue: frame, strokes and word are drawn in turn. */
      .boot-lockup { width: min(270px, 74vw); height: auto; overflow: visible; color: var(--b-text); }
      .boot-lockup .l-fill { fill: var(--b-fill); }
      .boot-lockup .l-frame { stroke: var(--b-fill); }
      .boot-lockup .l-ch { fill: var(--b-on); clip-path: inset(0 0 100% 0); animation: l-reveal 0.6s 0.85s cubic-bezier(0.7, 0, 0.2, 1) forwards; }
      .boot-lockup .l-fill { opacity: 0; animation: l-fade 0.4s 0.55s ease-out forwards; }
      .boot-lockup .l-frame { stroke-dasharray: 100; stroke-dashoffset: 100; animation: l-draw 0.7s 0.05s cubic-bezier(0.6, 0, 0.2, 1) forwards; }
      .boot-lockup .l-word { clip-path: inset(0 100% 0 0); animation: l-wipe 0.7s 1.2s cubic-bezier(0.7, 0, 0.2, 1) forwards; }
      @keyframes l-draw { from { opacity: 1; } to { opacity: 1; stroke-dashoffset: 0; } }
      @keyframes l-fade { to { opacity: 1; } }
      @keyframes l-reveal { to { clip-path: inset(0 0 0 0); } }
      @keyframes l-wipe { to { clip-path: inset(0 0 0 0); } }
      .boot-bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
      .boot-bar::after {
        content: ""; display: block; width: 40%; height: 100%; border-radius: inherit;
        background: linear-gradient(90deg, var(--b-fill), var(--b-end));
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
      @keyframes boot-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-inner, .boot-bar::after, .boot-lockup * { animation: none !important; }
        .boot-lockup .l-fill { opacity: 1; }
        .boot-lockup .l-frame { stroke-dashoffset: 100; }
          .boot-lockup .l-word { clip-path: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" class="boot" role="status" aria-label="Ч-Банк">
        <div class="boot-inner">
          <svg class="boot-lockup" viewBox="0 0 285 84" role="img" aria-label="Ч-Банк" focusable="false" xmlns="http://www.w3.org/2000/svg">
            <rect class="l-fill" x="0" y="0" width="84" height="84" rx="22" />
            <rect class="l-frame" x="1.25" y="1.25" width="81.5" height="81.5" rx="21" fill="none" stroke-width="2.5" pathLength="100" />
            <path class="l-ch" transform="translate(22 23)" d="M0 0H9V12.5Q9 18 15.5 18H31V0H40V36H31V27H13Q0 27 0 15Z" />
            <g class="l-word" transform="translate(105 23)" fill="currentColor"><path fill-rule="evenodd" d="M0 0H40V9H9V13.5H24Q40 13.5 40 24.75Q40 36 24 36H0Z M9 22.5V27H24Q31 27 31 24.75Q31 22.5 24 22.5Z" /><path fill-rule="evenodd" transform="translate(41.5 0)" d="M0 36L17.5 0H28.5L46 36H35L32.6 31H13.4L11 36Z M17.3 23H28.7L23 11.3Z" /><path transform="translate(90.7 0)" d="M0 0H9V14.5H31V0H40V36H31V23.5H9V36H0Z" /><path transform="translate(137.1 0)" d="M0 0H9V15.2L30.5 0H42.5L21.2 17.6L43 36H30.8L14.6 22.6L9 27.3V36H0Z" /></g>
          </svg>
          <div class="boot-bar" aria-hidden="true"></div>
        </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
