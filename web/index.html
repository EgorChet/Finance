<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#0a0a0d" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finance" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Finance Analyzer</title>
    <style>
      /* Launch screen: shown until the app mounts and replaces #app's content. */
      html, body { margin: 0; background: #0a0a0d; }
      .boot {
        position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden;
        background:
          radial-gradient(60rem 28rem at 15% -8%, rgba(123, 108, 255, 0.28), transparent 60%),
          radial-gradient(40rem 22rem at 100% 0%, rgba(79, 195, 255, 0.16), transparent 60%),
          radial-gradient(36rem 26rem at 50% 105%, rgba(226, 85, 200, 0.14), transparent 65%),
          #0a0a0d;
        color: #f4f4f6;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
      }
      .boot-inner { display: grid; justify-items: center; gap: 18px; animation: boot-in 0.5s ease-out both; }
      /* The same mark and drawn word as AppLogo.vue: frame, strokes, dot and word are drawn in turn. */
      .boot-lockup { width: min(300px, 80vw); height: auto; overflow: visible; color: #f4f4f6; }
      .boot-lockup .l-fill { opacity: 0; animation: l-fade 0.4s 0.55s ease-out forwards; }
      .boot-lockup .l-frame { stroke-dasharray: 100; stroke-dashoffset: 100; animation: l-draw 0.7s 0.05s cubic-bezier(0.6, 0, 0.2, 1) forwards; }
      .boot-lockup .l-s { stroke-dasharray: 100; stroke-dashoffset: 100; }
      .boot-lockup .l-s1 { animation: l-draw 0.55s 0.6s cubic-bezier(0.6, 0, 0.2, 1) forwards; }
      .boot-lockup .l-s2 { animation: l-draw 0.55s 0.95s cubic-bezier(0.6, 0, 0.2, 1) forwards; }
      .boot-lockup .l-dot { opacity: 0; transform-box: fill-box; transform-origin: center; animation: l-pop 0.5s 1.4s cubic-bezier(0.2, 1.4, 0.4, 1) forwards; }
      .boot-lockup .l-ring { opacity: 0; transform-box: fill-box; transform-origin: center; animation: l-ring 0.9s 1.45s ease-out forwards; }
      .boot-lockup .l-word { clip-path: inset(0 100% 0 0); animation: l-wipe 0.7s 1.2s cubic-bezier(0.7, 0, 0.2, 1) forwards; }
      @keyframes l-draw { to { stroke-dashoffset: 0; } }
      @keyframes l-fade { to { opacity: 1; } }
      @keyframes l-pop { from { opacity: 0; transform: scale(0.2); } to { opacity: 1; transform: none; } }
      @keyframes l-ring { from { opacity: 0.9; transform: scale(1); } to { opacity: 0; transform: scale(3.2); } }
      @keyframes l-wipe { to { clip-path: inset(0 0 0 0); } }
      .boot-bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
      .boot-bar::after {
        content: ""; display: block; width: 40%; height: 100%; border-radius: inherit;
        background: linear-gradient(90deg, #7b6cff, #e255c8);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
      @keyframes boot-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-inner, .boot-bar::after, .boot-lockup * { animation: none !important; }
        .boot-lockup .l-fill, .boot-lockup .l-dot { opacity: 1; }
        .boot-lockup .l-frame { stroke-dashoffset: 100; }
        .boot-lockup .l-s { stroke-dashoffset: 0; }
        .boot-lockup .l-word { clip-path: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status" aria-label="Loading Finance">
        <div class="boot-inner">
          <svg class="boot-lockup" viewBox="0 0 360 48" role="img" aria-label="Finance" focusable="false" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="boot-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b6cff"/><stop offset="0.55" stop-color="#a35cff"/><stop offset="1" stop-color="#e255c8"/></linearGradient></defs>
            <g>
              <rect class="l-fill" x="2" y="2" width="44" height="44" rx="13" fill="url(#boot-g)"/>
              <rect class="l-frame" x="2" y="2" width="44" height="44" rx="13" fill="none" stroke="url(#boot-g)" stroke-width="2.5" pathLength="100"/>
              <g stroke="#fff" stroke-width="4.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path class="l-s l-s1" pathLength="100" d="M14 34V14H22a6 6 0 0 1 6 6V28"/>
                <path class="l-s l-s2" pathLength="100" d="M34 14V34H26a6 6 0 0 1-6-6V20"/>
              </g>
              <circle class="l-ring" cx="39" cy="9.5" r="3" fill="none" stroke="#4fc3ff" stroke-width="1.4"/>
              <circle class="l-dot" cx="39" cy="9.5" r="2.6" fill="#4fc3ff"/>
            </g>
            <g class="l-word" transform="translate(64 8)" stroke="currentColor" stroke-width="6" fill="none" stroke-linejoin="bevel" stroke-linecap="butt">
              <path d="M4 36V4H32M4 20H26"/><path transform="translate(48 0)" d="M4 4V36"/><path transform="translate(68 0)" d="M4 36V4L36 36V4"/>
              <path transform="translate(116 0)" d="M4 36L20 4L36 36M10 26H30"/><path transform="translate(164 0)" d="M4 36V4L36 36V4"/>
              <path transform="translate(212 0)" d="M36 8Q32 4 22 4Q4 4 4 20Q4 36 22 36Q32 36 36 32"/><path transform="translate(260 0)" d="M36 4H4V36H36M4 20H28"/>
            </g>
          </svg>
          <div class="boot-bar" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
